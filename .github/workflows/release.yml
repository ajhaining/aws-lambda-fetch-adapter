# Based on https://github.com/googleapis/release-please-action
name: Verify and release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Use the npm version pinned by Volta
        run: npm install --global "npm@$(node -p 'require("./package.json").volta.npm')"

      - name: Install dependencies
        run: npm clean-install

      - name: Verify dependency signatures and attestations
        run: npm audit signatures

      - name: Check source and package
        run: npm run check

  release_please:
    name: Create or update release
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please-main
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    name: Publish to npm
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: npm-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release_please.outputs.sha }}
          persist-credentials: false

      - name: Set up the Node.js version pinned by Volta
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Use the npm version pinned by Volta
        run: npm install --global "npm@$(node -p 'require("./package.json").volta.npm')"

      - name: Install dependencies
        run: npm clean-install

      - name: Verify dependency signatures and attestations
        run: npm audit signatures

      - name: Build package
        run: npm run build

      - name: Publish package
        run: npm publish
        env:
          # npm cannot attest packages built from private source repositories.
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
